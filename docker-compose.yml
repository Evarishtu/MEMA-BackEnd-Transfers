version: '3.9'
services: 
  app-producto3_1:
    build: 
      context: ./docker
      dockerfile: Dockerfile
    container_name: mema_app_producto3_1
    ports:
      - '8080:80'
    volumes:
      - ./src:/var/www/html
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - database-producto3_1
      - mailhog-producto3_1
    networks:
      - mema_net  
  database-producto3_1:
    image: mysql:8.0
    container_name: mema_db_producto3_1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mema_transfers_p3_1
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data_p3_1:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d
    ports:
      - '3307:3306'
    networks:
      - mema_net
  phpmyadmin-producto3_1:
    image: phpmyadmin:5
    container_name: mema_phpmyadmin_producto3_1
    restart: always
    environment:
      PMA_HOST: database-producto3_1
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - '8081:80'
    depends_on:
      - database-producto3_1
    networks:
      - mema_net
  mailhog-producto3_1:
    image: mailhog/mailhog
    container_name: mema_mailhog_producto3_1
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - mema_net
  wordpress-producto4:
    image: wordpress:php8.3-apache
    container_name: mema_wordpress_producto4
    restart: always
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: database-wordpress-producto4
      WORDPRESS_DB_NAME: mema_wordpress_p4
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      - database-wordpress-producto4
    networks:
      - mema_net
  database-wordpress-producto4:
    image: mysql:8.0
    container_name: mema_db_wordpress_producto4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mema_wordpress_p4
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
    volumes:
      - db_data_wordpress_p4:/var/lib/mysql
    networks:
      - mema_net
  phpmyadmin-wordpress-producto4:
    image: phpmyadmin:5
    container_name: mema_phpmyadmin_wordpress_producto4
    restart: always
    environment:
      PMA_HOST: database-wordpress-producto4
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8083:80"
    depends_on:
      - database-wordpress-producto4
    networks:
      - mema_net
volumes:
  db_data_p3_1:
  db_data_wordpress_p4:

networks:
  mema_net:
    driver: bridge